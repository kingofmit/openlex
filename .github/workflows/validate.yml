name: Validate Data

on:
  pull_request:
    paths:
      - 'packages/statutes/src/data/**'
      - 'packages/regulations/src/data/**'
      - 'packages/courts/src/data/**'
  push:
    branches: [main]
    paths:
      - 'packages/statutes/src/data/**'
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Type check all packages
        run: |
          for pkg in core statutes regulations courts search export api react; do
            echo "Type checking @openlex/$pkg..."
            npx tsc --noEmit -p packages/$pkg/tsconfig.json
          done

      - name: Verify entry counts
        run: |
          for f in packages/statutes/src/data/*.ts; do
            name=$(basename "$f" .ts)
            if [ "$name" = "index" ]; then continue; fi
            count=$(grep -c 'jurisdiction:' "$f")
            echo "$name: $count entries"
            if [ "$count" -ne 51 ]; then
              echo "ERROR: $name has $count entries, expected 51"
              exit 1
            fi
          done

  url-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Check source URLs are reachable
        run: |
          echo "Checking source URLs..."
          errors=0
          total=0
          while IFS= read -r url; do
            total=$((total + 1))
            status=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 "$url" 2>/dev/null || echo "000")
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "FAIL [$status]: $url"
              errors=$((errors + 1))
            fi
          done < <(grep -roh 'https://[^"]*' packages/statutes/src/data/*.ts | sort -u | head -100)
          echo ""
          echo "Checked $total URLs, $errors failures"
          if [ "$errors" -gt 10 ]; then
            echo "ERROR: Too many URL failures ($errors)"
            exit 1
          fi
